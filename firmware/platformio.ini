; ============================================================================
;  FIR - Floating Inspector Robot (KSTI 2026 - IoT, Smart Home & Environment)
;  Board fisik : ESP32-S3 WROOM N16R8 CAM RHYX M21 (IOT Store)
;                flash 16 MB, PSRAM 8 MB OPI (octal), modul kamera bawaan
;  Board ID    : esp32-s3-devkitc-1 (generik ESP32-S3; varian CAM generik
;                seperti RHYX M21 tidak punya board ID khusus di PlatformIO,
;                jadi devkitc-1 + penyesuaian memory_type di bawah ini
;                adalah konfigurasi yang benar untuk N16R8)
; ============================================================================
[env:fir-esp32s3cam]
platform = espressif32@^7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = flash 16 MB QIO + PSRAM 8 MB OPI. Tanpa baris memory_type ini
; PSRAM oktal tidak terdeteksi (psramFound() = false, kamera turun ke CIF).
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB

; huge_app.csv: app +-3 MB (cukup untuk firmware kamera) + sisa flash
; +-9,9 MB untuk partisi LittleFS (log CSV FIR).
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

; Model AI FIR butuh buffer cadangan jauh di atas bawaan SDK: puluhan layer
; conv meminta buffer persisten 128 B saat model_init; tanpa batas lebih
; besar alokasi mengembalikan NULL di tengah init -> panic StoreProhibited
; (v6.9.9). CATATAN: yang berlaku murni dari flag di bawah ini hanya scratch
; (144). Untuk buffer luapan, flag -D TIDAK cukup: porting header library
; (edge-impulse-sdk/porting/ei_classifier_porting.h) mendefinisikan 30 khusus
; ESP32S3 TANPA #ifndef sehingga menimpa flag; define di berkas itu sudah
; diperbaiki menjadi 256 dan berkasnya ikut di paket v6.9.9.
; v7.0.8: kernel ESP-NN DIMATIKAN (-D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0)
; sebagai obat CORRUPT HEAP "Bad tail" yang terdeteksi di reset model
; sesudah run_classifier OK di board (canary heap berubah hanya 1 byte
; teratas, 0xbaad5678 -> 0x68ad5678). Pola ini cocok dengan bug
; tulis-di-luar-batas kernel konvolusi ESP-NN khusus ESP32-S3
; (espressif/esp-nn issue #7 & #8) dan anjuran staf Edge Impulse di forum
; resmi. Define dijaga #ifndef di ei_classifier_config.h pustaka
; (baris 82) dan komentar header itu sendiri menganjurkan override
; lewat -D, jadi flag di bawah inilah mekanisme yang benar-benar
; berlaku; inferensi jatuh ke kernel referensi TFLite (lebih lambat -
; ai_ms di telemetri/log menjadi pembanding). Bantalan alokasi
; EI_ALLOC_PAD_BYTES 256 di main.cpp tetap dipertahankan.
build_flags =
    -D EI_MAX_OVERFLOW_BUFFER_COUNT=256
    -D EI_MAX_SCRATCH_BUFFER_COUNT=144
    -D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0

; OneWire + DallasTemperature untuk DS18B20. Sisanya (WiFi, WebServer,
; LittleFS, Wire, esp_camera) sudah termasuk framework Arduino-ESP32.
; lib_deps DIMATIKAN - semua library sudah lokal di folder lib (laptop offline)
;lib_deps =
;	paulstoffregen/OneWire@^2.3.8
;	milesburton/DallasTemperature@^3.11.0
